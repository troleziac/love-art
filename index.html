<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOVE GERADOR ARTISTICO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Playfair+Display:ital,wght@0,400;1,900&family=Abril+Fatface&family=Archivo:wght@700&display=swap">
<style>
:root{--bg:#f4efff;--ink:#1d1630;--card:#fff;--pink:#ff4f9a;--line:#d9ccff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17112b;--ink:#f4efff;--card:#251c44;--line:#3d3068}}
:root[data-theme="dark"]{--bg:#17112b;--ink:#f4efff;--card:#251c44;--line:#3d3068}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
button,.file{font:inherit;color:var(--ink)}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-block}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.phrases{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.phrases .chip{border-radius:16px;text-align:left}
.file{border-style:dashed}
.go:disabled{opacity:.35;cursor:not-allowed}
.lb{font-size:14px;opacity:.7;margin-right:2px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:3px solid var(--pink);outline-offset:2px}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.dot[aria-pressed=true]{outline:3px solid var(--pink);outline-offset:2px}
.stage{display:flex;justify-content:center;padding:14px;border:2px solid var(--line);border-radius:18px;margin-bottom:14px;
background:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0) 0 0/20px 20px}
canvas{max-width:100%;max-height:60vh;height:auto;width:auto;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.go{width:100%;border:0;background:var(--pink);color:#fff;font-weight:800;font-size:19px;padding:15px;border-radius:16px;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#res{margin-top:14px;text-align:center;font-size:15px}
#res img{max-width:60%;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>escolha a frase e a foto</h1>
<div class="phrases" id="phrases" role="group" aria-label="Frases"></div>
<input type="text" id="dt" maxlength="20" placeholder="data (obrigatório) ex.: qui 01.nov 20h" aria-label="Data (obrigatório)" required>
<div class="row">
<label class="chip file"><input type="file" id="file" accept="image/*">adicionar foto (obrigatório)</label>
<button class="chip" id="rm" hidden>remover foto</button>
</div>
<div class="row" id="fmt" role="group" aria-label="Formato">
<button class="chip" data-f="feed" aria-pressed="true">feed</button>
<button class="chip" data-f="stories" aria-pressed="false">stories</button>
<button class="chip" id="flt" aria-pressed="true">filtro</button>
</div>
<div class="row"><span class="lb">texto</span><span class="row" id="fcols" role="group" aria-label="Cor do texto" style="margin:0"></span></div>
<div class="stage"><canvas id="c" aria-label="Prévia da imagem"></canvas></div>
<button class="go" id="dl">baixar</button>
<div id="res"></div>
</main>

function filt(W,H,tone){

var l=cl(.3*r+.59*g+.11*b)/255;
r=r*.5+(sh[0]+(hi[0]-sh[0])*l)*.5;g=g*.5+(sh[1]+(hi[1]-sh[1])*l)*.5;b=b*.5+(sh[2]+(hi[2]-sh[2])*l)*.5}
d[i]=cl(r+n);d[i+1]=cl(g+n);d[i+2]=cl(b+n)}
ctx.putImageData(id,0,0)}
